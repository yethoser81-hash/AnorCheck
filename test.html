<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
/>

<title>ANOR V6 - Prototype</title>

<style>

body {

    margin: 0;

    padding: 30px;

    font-family:
        Arial,
        sans-serif;

    background:
        #eeeeee;
}

main {

    max-width:
        1000px;

    margin:
        auto;
}

.panel {

    background:
        white;

    padding:
        20px;

    margin-bottom:
        20px;

    border-radius:
        12px;
}

canvas {

    max-width:
        100%;

    border:
        1px solid #aaa;
}

button {

    padding:
        12px 18px;

    margin:
        5px;

    cursor:
        pointer;
}

pre {

    background:
        #111;

    color:
        #0f0;

    padding:
        15px;

    overflow:
        auto;
}

.success {

    font-size:
        20px;

    font-weight:
        bold;
}

</style>

</head>

<body>

<main>

<div class="panel">

<h1>ANOR CHECK — V6</h1>

<p>
Prototype local de lecture.
</p>

<button id="generate">
Générer le sceau
</button>

<button id="mock">
Tester MOCKUP
</button>

<button id="read">
Lire le sceau local
</button>

<input
    id="file"
    type="file"
    accept="image/*"
/>

</div>


<div class="panel">

<h2>Sceau de référence</h2>

<canvas
    id="seal"
    width="800"
    height="800"
></canvas>

</div>


<div class="panel">

<h2>Résultat</h2>

<div
    id="result"
>
En attente...
</div>

<pre
    id="debug"
></pre>

</div>

</main>


<script src="./GlyphsLibrary.js"></script>

<script src="./SealDecoderV6.js"></script>

<script src="./SealRendererV6.js"></script>


<script>

const canvas =
    document.getElementById(
        "seal"
    );

const result =
    document.getElementById(
        "result"
    );

const debug =
    document.getElementById(
        "debug"
    );


/**
 * ------------------------------------------------------------
 * Génération
 * ------------------------------------------------------------
 */

function generate() {

    SealRendererV6.draw(
        canvas
    );

    result.innerHTML =
        "Sceau généré.";

    debug.textContent =
        "";
}


document
    .getElementById(
        "generate"
    )
    .onclick =
    generate;


/**
 * ------------------------------------------------------------
 * MOCKUP
 * ------------------------------------------------------------
 */

document
    .getElementById(
        "mock"
    )
    .onclick =
    async () => {

        const r =
            await SealDecoderV6.decode(
                canvas,
                {
                    mockup: true
                }
            );

        showResult(r);
    };


/**
 * ------------------------------------------------------------
 * Lecture locale
 * ------------------------------------------------------------
 */

document
    .getElementById(
        "read"
    )
    .onclick =
    async () => {

        const r =
            await SealDecoderV6.decode(
                canvas
            );

        showResult(r);
    };


/**
 * ------------------------------------------------------------
 * Image externe
 * ------------------------------------------------------------
 */

document
    .getElementById(
        "file"
    )
    .onchange =
    event => {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }


        const image =
            new Image();


        image.onload =
            async () => {

                canvas.width =
                    image.naturalWidth;

                canvas.height =
                    image.naturalHeight;


                const ctx =
                    canvas.getContext(
                        "2d"
                    );


                ctx.drawImage(
                    image,
                    0,
                    0
                );


                const r =
                    await SealDecoderV6.decode(
                        canvas
                    );


                showResult(r);
            };


        image.src =
            URL.createObjectURL(
                file
            );
    };


/**
 * ------------------------------------------------------------
 * Affichage
 * ------------------------------------------------------------
 */

function showResult(r) {

    result.innerHTML =

        `<div class="success">
            ${r.success
                ? "✓ SCEAU LU"
                : "✗ LECTURE ÉCHOUÉE"}
        </div>

        <p>
            Status :
            <strong>
                ${r.status}
            </strong>
        </p>

        <p>
            Mode :
            ${r.mode}
        </p>

        <p>
            Visual bits :
            <br>
            <strong>
                ${r.visualBits || "—"}
            </strong>
        </p>

        <p>
            Signature :
            <br>
            <strong>
                ${r.visualSignature || "—"}
            </strong>
        </p>

        <p>
            Confiance :
            ${r.confidence}
        </p>`;


    debug.textContent =
        JSON.stringify(
            r,
            null,
            2
        );
}


/**
 * Génération automatique.
 */

generate();

</script>

</body>

</html>
